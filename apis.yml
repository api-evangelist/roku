- data:
  - name: Channel Development
    description: BrightScript and SceneGraph frameworks for building Roku TV streaming
      channel applications.
  - name: Device Control
    description: Local-network HTTP API (ECP) for discovery, key injection, app launching,
      and diagnostics.
  - name: Roku Pay
    description: Server-to-server billing APIs for transaction validation, refunds,
      and subscription management.
  - name: Direct Publisher
    description: JSON feed ingestion path for non-technical publishers to populate
      Roku channels.
  - name: Search Feed
    description: Catalog feed ingestion that surfaces publisher content in Roku Search.
  - name: Nabu Cloud
    description: Roku's developer cloud for managing remote test devices, snapshots,
      and builds.
  - name: Channel Store Monetization
    description: Transactional and subscription monetization through ChannelStore
      and roChannelStore components.
  - name: Advertising Framework
    description: Roku Advertising Framework (RAF) for monetizing video content with
      ads.
  type: Features
- data:
  - name: Streaming Channel Development
    description: Build full-screen TV streaming channels with BrightScript/SceneGraph
      and ship to the Roku Channel Store.
  - name: Subscription Video On Demand
    description: Monetize video content with recurring subscriptions managed by Roku
      Pay.
  - name: Transactional Video On Demand
    description: Monetize individual movie/episode purchases via the Channel Store
      and Roku Pay.
  - name: Free Ad-Supported Streaming TV
    description: Free streaming with the Roku Advertising Framework.
  - name: TV Remote and Home Automation
    description: Build mobile or hub-based remote-control apps that drive Roku devices
      via ECP.
  - name: Automated Channel Testing
    description: Run channel certification tests on remote Roku test devices in Nabu
      Cloud.
  type: UseCases
- data:
  - name: Visual Studio Code
    description: BrightScript language extension for VSCode with debugging and side-loading.
  - name: Selenium WebDriver
    description: WebDriver-based automated channel testing.
  - name: npm
    description: roku-deploy and roku-debug published as npm packages.
  - name: Sublime Text
    description: BrightScript syntax-highlighting package.
  - name: GitHub
    description: Source-of-truth for Roku-published samples, tooling, and the dev-doc
      OpenAPI spec.
  type: Integrations
maintainers:
