    url: examples/roku-search-feed-simple-example.json
    title: Simple Search Feed Example
  - type: Examples
    url: examples/roku-search-feed-advanced-example.json
    title: Advanced Search Feed Example
- aid: roku:direct-publisher-feed
  name: Roku Direct Publisher Feed
  humanURL: https://github.com/rokudev/feed-specifications
  description: >-
    Roku Direct Publisher (RDP) feed is a JSON feed specification that allows non-technical publishers
    to populate channels by hosting a structured catalog of short-form videos, movies, series, episodes,
    and live feeds. Roku ingests the feed on a schedule and renders the channel UI automatically.
  tags:
  - Feed
  - Direct Publisher
  - Content Catalog
  properties:
  - type: Documentation
    url: >-
      https://github.com/rokudev/feed-specifications/blob/master/direct-publisher-feed-specification.md
  - type: APIReference
    url: https://github.com/rokudev/feed-specifications
  - type: Examples
    url: examples/roku-direct-publisher-feed-example.json
    title: Direct Publisher Feed Example
- aid: roku:analytics
  name: Roku Analytics
  humanURL: https://developer.roku.com/docs/developer-program/marketing/roku-analytics.md
  description: >-
    Roku Analytics provides performance reporting, audience metrics, and engagement data for Roku channel
    publishers. Reports are accessed through the Roku Developer Dashboard rather than a public REST API.
  tags:
  - Analytics
  - Reporting
  properties:
  - type: Documentation
    url: https://developer.roku.com/docs/developer-program/marketing/roku-analytics.md
- aid: roku:authentication
  name: Roku Authentication Framework
  humanURL: >-
    https://developer.roku.com/docs/developer-program/authentication/authentication-overview.md
  description: >-
    APIs and patterns for implementing user sign-in and authentication within Roku channels, including
    device-linking ("on-device authentication") and OAuth-style flows. The framework is implemented in
    BrightScript on the device; the publisher's authentication backend is custom-built.
  tags:
  - Authentication
  tags_raw:
  - Authentication
  - OAuth
  properties:
  - type: Documentation
    url: >-
      https://developer.roku.com/docs/developer-program/authentication/authentication-overview.md
  - type: CodeExamples
    url: https://github.com/rokudev/on-device-authentication
    title: On-Device Authentication Sample
