description: Roku is the leading TV streaming platform in the U.S., Canada, and Mexico,
  offering a comprehensive operating system that powers smart TVs, streaming players,
  and audio devices. Roku provides a robust developer program for building channel
  apps, monetizing through Roku Pay, integrating analytics, and controlling devices
  via the External Control Protocol. The platform supports both BrightScript and SceneGraph
  frameworks for app development, and the Nabu Cloud developer cloud for managing
  remote test devices and channel builds.
