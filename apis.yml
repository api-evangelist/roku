apis:
- aid: roku:brightscript
  name: Roku BrightScript SDK
  humanURL: https://developer.roku.com/docs/references/brightscript/component-reference.md
  description: >-
    BrightScript is Roku's scripting language used to build apps for the Roku platform. The SDK provides
    a comprehensive component library with over 100 built-in objects covering UI, networking, media playback,
    and device interaction. BrightScript is a programming language and on-device runtime, not a network
    API.
  tags:
  - SDK
  - BrightScript
  - Channel Development
  properties:
  - type: Documentation
    url: https://developer.roku.com/docs/references/brightscript/component-reference.md
  - type: APIReference
    url: https://developer.roku.com/docs/references/brightscript/component-reference.md
  - url: graphql/roku-graphql.md
    type: GraphQL
- aid: roku:scenegraph
  name: Roku SceneGraph
  humanURL: https://developer.roku.com/docs/developer-program/core-concepts/scenegraph-overview.md
  description: >-
    SceneGraph is Roku's XML-based declarative UI framework for building rich, performant channel applications.
    It provides node components, animations, and a scene-based architecture. SceneGraph is an on-device
    UI framework, not a network API.
  tags:
  - UI Framework
  - SceneGraph
  - Channel Development
  properties:
  - type: Documentation
    url: https://developer.roku.com/docs/developer-program/core-concepts/scenegraph-overview.md
  - type: APIReference
    url: https://developer.roku.com/docs/references/scenegraph/component-reference.md
- aid: roku:search-feed
  name: Roku Search Feed
  humanURL: https://github.com/rokudev/search-feed-json
  description: >-
    Roku Search Feed is a JSON feed format that publishers ingest to expose their catalog to Roku Search.
    The feed provides movies, series, episodes, short-form videos, TV specials, and live feeds with localized
    titles, descriptions, ratings, content links, and external IDs.
  tags:
  - Feed
  - Search
  - Content Catalog
  properties:
  - type: Documentation
    url: https://github.com/rokudev/search-feed-json
  - type: JSONSchema
    url: json-schema/search-feed-schema.json
    title: Search Feed Schema
