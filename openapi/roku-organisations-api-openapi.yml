components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OrganisationOut:
      properties:
        id:
          type: integer
          title: Id
        idp_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Idp Id
          description: Identity Provider(IdP) ID of the organisation
        name:
          type: string
          maxLength: 255
          minLength: 3
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          title: Name
          description: Slug of the organisation, used in URLs
        slug:
          type: string
          title: Slug
          description: Name of the organisation
        max_devices:
          type: integer
          exclusiveMinimum: 0
          title: Max Devices
          description: Maximum number of devices in the organisation
        max_snapshots:
          type: integer
          exclusiveMinimum: 0
          title: Max Snapshots
          description: Maximum number of snapshots in the organisation
        max_project_devices:
          type: integer
          minimum: 0
          title: Max Project Devices
          description: Maximum number of devices in the organisation per project, 0 for Organisation max
        max_project_snapshots:
          type: integer
          minimum: 0
          title: Max Project Snapshots
          description: Maximum number of snapshots in the organisation per project, 0 for Organisation max
        max_project_runtime:
          type: integer
          minimum: 0
          title: Max Project Runtime
          description: Maximum runtime of a device in the organisation per project, 0 for Organisation max
        current_devices:
          type: integer
          minimum: 0
          title: Current Devices
          default: 0
        current_snapshots:
          type: integer
          minimum: 0
          title: Current Snapshots
          default: 0
      type: object
      required:
      - id
      - name
      - slug
      - max_devices
      - max_snapshots
      - max_project_devices
      - max_project_snapshots
      - max_project_runtime
      title: OrganisationOut
    OrganisationMemberOut:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        username:
          type: string
          title: Username
        organisation_role_id:
          type: integer
          title: Organisation Role Id
        organisation_role_name:
          type: string
          title: Organisation Role Name
      type: object
      required:
      - user_id
      - username
      - organisation_role_id
      - organisation_role_name
      title: OrganisationMemberOut
    AgentStreamOption:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: AgentStreamOption
    GroupRoleOut:
      properties:
        group_role_id:
          type: integer
          title: Group Role Id
        name:
          type: string
          title: Name
        permissions:
          items:
            type: string
          type: array
          title: Permissions
      type: object
      required:
      - group_role_id
      - name
      - permissions
      title: GroupRoleOut
    AWSRegion:
      type: string
      enum:
      - us-west-2
      title: AWSRegion
    ProjectRoleOut:
      properties:
        project_role_id:
          type: integer
          title: Project Role Id
        name:
          type: string
          title: Name
        permissions:
          items:
            type: string
          type: array
          title: Permissions
      type: object
      required:
      - project_role_id
      - name
      - permissions
      title: ProjectRoleOut
    OrganisationRegionOut:
      properties:
        region_id:
          type: integer
          title: Region Id
        region_name:
          type: string
          title: Region Name
        aws_region:
          $ref: '#/components/schemas/AWSRegion'
        agent_active:
          type: boolean
          title: Agent Active
        agent_stream_options:
          items:
            $ref: '#/components/schemas/AgentStreamOption'
          type: array
          title: Agent Stream Options
      type: object
      required:
      - region_id
      - region_name
      - aws_region
      - agent_active
      - agent_stream_options
      title: OrganisationRegionOut
