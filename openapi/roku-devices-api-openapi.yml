openapi: 3.2.0
info:
  title: Roku Nabu Cloud Devices API
  contact:
    name: DevX Tools Team
    email: dldevxtools@roku.com
  version: 1.3.29
  description: Nabu Cloud is Roku's developer cloud platform for managing test devices, snapshots, builds, projects, organisations, groups, and personal access tokens. It provides REST APIs for orchestrating remote Roku test devices and CI/CD workflows.
  x-generated-from: rokudev/dev-doc
  x-source-url: https://github.com/rokudev/dev-doc/blob/v2.0/reference/openapi.json
servers:
- url: https://api.cloud.roku.dev
  description: Roku Nabu Cloud Production
tags:
- name: devices
paths:
  /api/v1/organisations/{organisation_id}/projects/{project_id}/devices:
    get:
      tags:
      - devices
      summary: Roku List Devices
      description: Show devices in a project.
      operationId: devices-list_devices
      security:
      - Nabu Cloud: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: organisation_id
        in: path
        required: true
        schema:
          type: integer
          title: Organisation Id
      - name: items
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000
          description: The number of items per page. Use 0 for no limit.
          default: 100
          title: Items
        description: The number of items per page. Use 0 for no limit.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: The page number. Use 0 for the first page.
          default: 0
          title: Page
        description: The page number. Use 0 for the first page.
      - name: esn
        in: query
        required: false
        schema:
          type: string
          minLength: 12
          maxLength: 12
          pattern: ^XY+([A-Z0-9]+)?$
          description: The ESN of the device.
          title: Esn
        description: The ESN of the device.
      - name: device_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DeviceType'
          description: The type of the Device.
          examples:
          - tv
        description: The type of the Device.
      - name: name
        in: query
        required: false
        schema:
          type: string
          minLength: 3
          maxLength: 255
          description: The name of the Device.
          title: Name
        description: The name of the Device.
      - name: description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 4096
          - type: 'null'
          description: Description of the Device.
          title: Description
        description: Description of the Device.
      - name: account_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          description: Account name of the Device.
          examples:
          - user@roku.com
          title: Account Name
        description: Account name of the Device.
      - name: properties
        in: query
        required: false
        schema:
          anyOf:
          - type: object
            additionalProperties: true
            maxProperties: 8192
          - type: 'null'
          description: Device properties.
          examples:
          - {}
          - config_service_flags:
              fw.swup.channel-sync-enabled: 'false'
          title: Properties
        description: Device properties.
      - name: qa_hub
        in: query
        required: false
        schema:
          type: boolean
          description: Whether the device should be auto registered in QA Hub.
          title: Qa Hub
        description: Whether the device should be auto registered in QA Hub.
      - name: created_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: The day the device was created
          title: Created At
        description: The day the device was created
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceOut'
                title: Response Devices-List Devices
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - devices
      summary: Roku Create Device
      operationId: devices-create_device
      security:
      - Nabu Cloud: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: organisation_id
        in: path
        required: true
        schema:
          type: integer
          title: Organisation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}:
    get:
      tags:
      - devices
      summary: Roku Get Device
      operationId: devices-get_device
      security:
      - Nabu Cloud: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: organisation_id
        in: path
        required: true
        schema:
          type: integer
          title: Organisation Id
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - devices
      summary: Roku Update Device
      operationId: devices-update_device
      security:
      - Nabu Cloud: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: organisation_id
        in: path
        required: true
        schema:
          type: integer
          title: Organisation Id
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - devices
      summary: Roku Delete Device
      operationId: devices-delete_device
      security:
      - Nabu Cloud: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: organisation_id
        in: path
        required: true
        schema:
          type: integer
          title: Organisation Id
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          title: Device Id
      - name: delete_snapshots
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Delete Snapshots
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/start:
    post:
      tags:
      - devices
      summary: Roku Start Device
      operationId: devices-start_device
      security:
      - Nabu Cloud: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: organisation_id
        in: path
        required: true
        schema:
          type: integer
          title: Organisation Id
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          title: Device Id
      - name: skip_build_validation
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Skip Build Validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStart'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/stop:
    post:
      tags:
      - devices
      summary: Roku Stop Device
      operationId: devices-stop_device
      security:
      - Nabu Cloud: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: organisation_id
        in: path
        required: true
        schema:
          type: integer
          title: Organisation Id
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          title: Device Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/runs:
    get:
      tags:
      - devices
      summary: Roku Get Device Runs
      operationId: devices-get_device_runs
      security:
      - Nabu Cloud: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: organisation_id
        in: path
        required: true
        schema:
          type: integer
          title: Organisation Id
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceHistoryOut'
                title: Response Devices-Get Device Runs
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/logs/{instance_id}:
    get:
      tags:
      - devices
      summary: Roku Read Logs
      operationId: devices-read_logs
      security:
      - Nabu Cloud: []
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: integer
          title: Instance Id
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: organisation_id
        in: path
        required: true
        schema:
          type: integer
          title: Organisation Id
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          title: Device Id
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DeviceInstanceInfo:
      properties:
        id:
          type: integer
          minimum: 0
          title: Id
        creator_id:
          type: string
          format: uuid
          title: Creator Id
          description: The ID of the user who started the device.
        created_at:
          type: string
          format: date-time
          title: Created At
        started_at:
          type: string
          format: date-time
          title: Started At
        snapshot_id:
          type: integer
          minimum: 0
          title: Snapshot Id
          description: The ID of the snapshot to use for the device.
        snapshot_name:
          type: string
          maxLength: 255
          minLength: 3
          title: Snapshot Name
          description: Name of the snapshot.
        region_id:
          type: integer
          minimum: 0
          title: Region Id
          description: The ID of the region where the device will run.
        region_name:
          type: string
          maxLength: 255
          minLength: 3
          title: Region Name
          description: Name of the region.
        stream_option_id:
          type: integer
          minimum: 0
          title: Stream Option Id
          description: The ID of the stream option to use for the device.
        stream_option_name:
          type: string
          maxLength: 255
          minLength: 3
          title: Stream Option Name
          description: 'Name of the stream option. '
        max_runtime:
          type: integer
          minimum: 0
          title: Max Runtime
          description: The maximum runtime of the device in seconds, 0 for project max runtime.
        rootfs_artifactory_path:
          type: string
          maxLength: 255
          minLength: 3
          pattern: ^[a-zA-Z0-9_-]*(\/[a-zA-Z0-9._-]+)*(\:[a-zA-Z0-9._-]+)?$
          title: Rootfs Artifactory Path
          description: The path of the rootfs image in artifactory.
          examples:
          - official/release/2024-h2/r14.0.4.122xx-rta/native_tv:latest
          - premergeci/native_tv:4838657
        reboot:
          type: integer
          maximum: 150
          minimum: -1
          title: Reboot
          description: Device reboot behaviour.-1 for no reboots, including requested reboot; 0 for no device crash reboots; and >0 for n number of device crash reboots.A device crash is determined by restart_reason in the device nvram. A device shutdown will act like a reboot.
        ip_address:
          anyOf:
          - type: string
            format: ipvanyaddress
          - type: 'null'
          title: Ip Address
          description: IP address of the running device Instance.
        janus_id:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Janus Id
          description: ID of the Janus WebRTC stream.
        janus_pin:
          anyOf:
          - type: string
          - type: 'null'
          title: Janus Pin
          description: Pin to access the Janus WebRTC stream.
        janus_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Janus Token
          description: Janus API Token.
        janus_websocket_url:
          anyOf:
          - type: string
            description: "\n            WebSocket URL to connect to the Janus WebRTC gateway. Includes the\n            ws:// prefix and the path to the instance.\n        "
          - type: 'null'
          title: Janus Websocket Url
        janus_ice_servers:
          anyOf:
          - items:
              $ref: '#/components/schemas/IceServer'
            type: array
            description: List of ICE servers to use for WebRTC connections.
          - type: 'null'
          title: Janus Ice Servers
        instance_api_url:
          anyOf:
          - type: string
            description: "\n            Url prefix for the instance api. Does not contain the protocol\n            prefix since the instance api contains both ws and http endpoints.\n        "
          - type: 'null'
          title: Instance Api Url
        instance_uuid:
          type: string
          format: uuid
          title: Instance Uuid
      type: object
      required:
      - id
      - creator_id
      - created_at
      - snapshot_id
      - region_id
      - stream_option_id
      - max_runtime
      - rootfs_artifactory_path
      - reboot
      - instance_uuid
      title: DeviceInstanceInfo
    IceServer:
      properties:
        urls:
          items:
            type: string
          type: array
          title: Urls
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        credential:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential
      type: object
      required:
      - urls
      title: IceServer
    DeviceHistoryOut:
      properties:
        instance_id:
          type: integer
          minimum: 0
          title: Instance Id
          description: ID of the device instance.
        creator_id:
          type: string
          format: uuid
          title: Creator Id
          description: The ID of the user who started the device.
        creator_username:
          type: string
          maxLength: 255
          minLength: 3
          title: Creator Username
          description: The username of the user who started the device.
        created_at:
          type: string
          format: date-time
          title: Created At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
        runtime:
          type: integer
          minimum: 0
          title: Runtime
          description: Runtime of the device in seconds.
        snapshot_id:
          type: integer
          minimum: 0
          title: Snapshot Id
          description: The ID of the snapshot to use for the device.
        snapshot_name:
          type: string
          maxLength: 255
          minLength: 3
          title: Snapshot Name
          description: Name of the snapshot.
        region_id:
          type: integer
          minimum: 0
          title: Region Id
          description: The ID of the region where the device will run.
        region_name:
          type: string
          maxLength: 255
          minLength: 3
          title: Region Name
          description: Name of the region.
        stream_option_id:
          type: integer
          minimum: 0
          title: Stream Option Id
          description: The ID of the stream option to use for the device.
        stream_option_name:
          type: string
          maxLength: 255
          minLength: 3
          title: Stream Option Name
          description: 'Name of the stream option. '
        max_runtime:
          type: integer
          minimum: 0
          title: Max Runtime
          description: The maximum runtime of the device in seconds, 0 for project max runtime.
        status:
          $ref: '#/components/schemas/KubernetesStatus'
        rootfs_artifactory_path:
          type: string
          maxLength: 255
          minLength: 3
          pattern: ^[a-zA-Z0-9_-]*(\/[a-zA-Z0-9._-]+)*(\:[a-zA-Z0-9._-]+)?$
          title: Rootfs Artifactory Path
          description: The path of the rootfs image in artifactory.
          examples:
          - official/release/2024-h2/r14.0.4.122xx-rta/native_tv:latest
          - premergeci/native_tv:4838657
        reboot:
          type: integer
          maximum: 150
          minimum: -1
          title: Reboot
          description: Device reboot behaviour.-1 for no reboots, including requested reboot; 0 for no device crash reboots; and >0 for n number of device crash reboots.A device crash is determined by restart_reason in the device nvram. A device shutdown will act like a reboot.
      type: object
      required:
      - instance_id
      - creator_id
      - creator_username
      - created_at
      - runtime
      - snapshot_id
      - region_id
      - stream_option_id
      - max_runtime
      - status
      - rootfs_artifactory_path
      - reboot
      title: DeviceHistoryOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DeviceUpdate:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 3
          title: Name
          description: The name of the Device.
        description:
          anyOf:
          - type: string
            maxLength: 4096
            minLength: 0
          - type: 'null'
          title: Description
          description: Description of the Device.
        account_name:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Account Name
          description: Account name of the Device.
          examples:
          - user@roku.com
        properties:
          anyOf:
          - additionalProperties: true
            type: object
            maxProperties: 8192
          - type: 'null'
