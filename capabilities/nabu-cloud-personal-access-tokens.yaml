naftiko: 1.0.0-alpha2
info:
  label: Roku Nabu Cloud — personal-access-tokens
  description: 'Roku Nabu Cloud — personal-access-tokens. 5 operations. Lead operation: Roku List Personal Access Tokens.
    Self-contained Naftiko capability covering one Roku business surface.'
  tags:
  - Roku
  - personal-access-tokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROKU_API_KEY: ROKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: nabu-cloud-personal-access-tokens
    baseUri: https://api.cloud.roku.dev
    description: Roku Nabu Cloud — personal-access-tokens business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-users-me-personal_access_tokens
      path: /api/v1/users/me/personal_access_tokens
      operations:
      - name: personalaccesstokenslistpersonalaccesstokens
        method: GET
        description: Roku List Personal Access Tokens
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: personalaccesstokenscreatepersonalaccesstoken
        method: POST
        description: Roku Create Personal Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-users-me-personal_access_tokens-scopes
      path: /api/v1/users/me/personal_access_tokens/scopes
      operations:
      - name: personalaccesstokensgetpersonalaccesstokenscopes
        method: GET
        description: Roku Get Personal Access Token Scopes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v1-users-me-personal_access_tokens-token_id
      path: /api/v1/users/me/personal_access_tokens/{token_id}
      operations:
      - name: personalaccesstokensrevokepersonalaccesstoken
        method: DELETE
        description: Roku Revoke Personal Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token_id
          in: path
          type: integer
          required: true
    - name: api-v1-users-me-personal_access_tokens-token_id-refresh
      path: /api/v1/users/me/personal_access_tokens/{token_id}/refresh
      operations:
      - name: personalaccesstokensrefreshpersonalaccesstoken
        method: PATCH
        description: Roku Refresh Personal Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token_id
          in: path
          type: integer
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: nabu-cloud-personal-access-tokens-rest
    port: 8080
    description: REST adapter for Roku Nabu Cloud — personal-access-tokens. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1/users/me/personal-access-tokens
      name: api-v1-users-me-personal-access-tokens
      description: REST surface for api-v1-users-me-personal_access_tokens.
      operations:
      - method: GET
        name: personalaccesstokenslistpersonalaccesstokens
        description: Roku List Personal Access Tokens
        call: nabu-cloud-personal-access-tokens.personalaccesstokenslistpersonalaccesstokens
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: personalaccesstokenscreatepersonalaccesstoken
        description: Roku Create Personal Access Token
        call: nabu-cloud-personal-access-tokens.personalaccesstokenscreatepersonalaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/users/me/personal-access-tokens/scopes
      name: api-v1-users-me-personal-access-tokens-scopes
      description: REST surface for api-v1-users-me-personal_access_tokens-scopes.
      operations:
      - method: GET
        name: personalaccesstokensgetpersonalaccesstokenscopes
        description: Roku Get Personal Access Token Scopes
        call: nabu-cloud-personal-access-tokens.personalaccesstokensgetpersonalaccesstokenscopes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/users/me/personal-access-tokens/{token-id}
      name: api-v1-users-me-personal-access-tokens-token-id
      description: REST surface for api-v1-users-me-personal_access_tokens-token_id.
      operations:
      - method: DELETE
        name: personalaccesstokensrevokepersonalaccesstoken
        description: Roku Revoke Personal Access Token
        call: nabu-cloud-personal-access-tokens.personalaccesstokensrevokepersonalaccesstoken
        with:
          token_id: rest.token_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/users/me/personal-access-tokens/{token-id}/refresh
      name: api-v1-users-me-personal-access-tokens-token-id-refresh
      description: REST surface for api-v1-users-me-personal_access_tokens-token_id-refresh.
      operations:
      - method: PATCH
        name: personalaccesstokensrefreshpersonalaccesstoken
        description: Roku Refresh Personal Access Token
        call: nabu-cloud-personal-access-tokens.personalaccesstokensrefreshpersonalaccesstoken
        with:
          token_id: rest.token_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: nabu-cloud-personal-access-tokens-mcp
    port: 9090
    transport: http
    description: MCP adapter for Roku Nabu Cloud — personal-access-tokens. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: roku-list-personal-access-tokens
      description: Roku List Personal Access Tokens
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: nabu-cloud-personal-access-tokens.personalaccesstokenslistpersonalaccesstokens
      outputParameters:
      - type: object
        mapping: $.
    - name: roku-create-personal-access-token
      description: Roku Create Personal Access Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: nabu-cloud-personal-access-tokens.personalaccesstokenscreatepersonalaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: roku-get-personal-access-token
      description: Roku Get Personal Access Token Scopes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: nabu-cloud-personal-access-tokens.personalaccesstokensgetpersonalaccesstokenscopes
      outputParameters:
      - type: object
        mapping: $.
    - name: roku-revoke-personal-access-token
      description: Roku Revoke Personal Access Token
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: nabu-cloud-personal-access-tokens.personalaccesstokensrevokepersonalaccesstoken
      with:
        token_id: tools.token_id
      outputParameters:
      - type: object
        mapping: $.
    - name: roku-refresh-personal-access-token
      description: Roku Refresh Personal Access Token
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: nabu-cloud-personal-access-tokens.personalaccesstokensrefreshpersonalaccesstoken
      with:
        token_id: tools.token_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
