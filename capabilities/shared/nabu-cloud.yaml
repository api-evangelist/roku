naftiko: "1.0.0-alpha1"

info:
  label: "Roku Nabu Cloud"
  description: "Roku's developer cloud platform for managing remote test devices, snapshots, builds, projects, organisations, groups, and personal access tokens. Used by Roku channel teams for CI/CD and test orchestration."
  tags:
    - Roku
    - Nabu Cloud
    - Developer Cloud
    - Test Devices
    - CI CD
  created: "2026-05-05"
  modified: "2026-05-05"

binds:
  - namespace: env
    keys:
      ROKU_NABU_CLOUD_TOKEN: ROKU_NABU_CLOUD_TOKEN

capability:
  consumes:
    - type: http
      namespace: roku-nabu-cloud
      baseUri: "https://api.cloud.roku.dev"
      description: "Roku Nabu Cloud production API."
      authentication:
        type: bearer
        token: "{{ROKU_NABU_CLOUD_TOKEN}}"
      resources:
        - name: health
          path: /api/v1/-
          description: "Service health endpoints."
          operations:
            - name: livez
              method: GET
              path: /api/v1/-/livez
              description: "Liveness probe."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: readyz
              method: GET
              path: /api/v1/-/readyz
              description: "Readiness probe."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: users
          path: /api/v1/users/me
          description: "Current user, organisations, projects, groups, and personal access tokens."
          operations:
            - name: get-me
              method: GET
              path: /api/v1/users/me
              description: "Returns the authenticated user."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-my-organisations
              method: GET
              path: /api/v1/users/me/organisations
              description: "Lists organisations the user belongs to."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-my-projects
              method: GET
              path: /api/v1/users/me/projects
              description: "Lists projects the user has access to."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-my-groups
              method: GET
              path: /api/v1/users/me/groups
              description: "Lists groups the user belongs to."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-personal-access-tokens
              method: GET
              path: /api/v1/users/me/personal_access_tokens
              description: "Lists the user's personal access tokens."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-personal-access-token
              method: POST
              path: /api/v1/users/me/personal_access_tokens
              description: "Creates a new personal access token."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  scopes: "{{tools.scopes}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: revoke-personal-access-token
              method: DELETE
              path: /api/v1/users/me/personal_access_tokens/{token_id}
              description: "Revokes a personal access token."
              inputParameters:
                - name: token_id
                  in: path
                  type: string
                  required: true
                  description: "Token identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: builds
          path: /api/v1/builds
          description: "Channel builds."
          operations:
            - name: list-builds
              method: GET
              path: /api/v1/builds
              description: "Lists all builds visible to the caller."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-build
              method: GET
              path: /api/v1/builds/{build_id}
              description: "Returns a single build by id."
              inputParameters:
                - name: build_id
                  in: path
                  type: string
                  required: true
                  description: "Build identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: projects
          path: /api/v1/organisations/{organisation_id}/projects
          description: "Project lifecycle inside an organisation."
          operations:
            - name: list-projects
              method: GET
              path: /api/v1/organisations/{organisation_id}/projects
              description: "Lists projects in an organisation."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-project
              method: POST
              path: /api/v1/organisations/{organisation_id}/projects
              description: "Creates a project."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-project
              method: GET
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}
              description: "Returns a single project."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-project
              method: DELETE
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}
              description: "Deletes a project."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: devices
          path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices
          description: "Remote test device lifecycle and runs."
          operations:
            - name: list-devices
              method: GET
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices
              description: "Lists devices in a project."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-device
              method: POST
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices
              description: "Allocates a new test device."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  region: "{{tools.region}}"
                  model: "{{tools.model}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-device
              method: GET
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}
              description: "Returns a single device."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
                - name: device_id
                  in: path
                  type: string
                  required: true
                  description: "Device identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: start-device
              method: POST
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/start
              description: "Starts a device run."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
                - name: device_id
                  in: path
                  type: string
                  required: true
                  description: "Device identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: stop-device
              method: POST
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/stop
              description: "Stops a device run."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
                - name: device_id
                  in: path
                  type: string
                  required: true
                  description: "Device identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: read-device-logs
              method: GET
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/logs/{instance_id}
              description: "Reads logs for a device run instance."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
                - name: device_id
                  in: path
                  type: string
                  required: true
                  description: "Device identifier."
                - name: instance_id
                  in: path
                  type: string
                  required: true
                  description: "Run instance identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: snapshots
          path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/snapshots
          description: "Device snapshot management."
          operations:
            - name: list-snapshots
              method: GET
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/snapshots
              description: "Lists snapshots for a device."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
                - name: device_id
                  in: path
                  type: string
                  required: true
                  description: "Device identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-snapshot
              method: POST
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/snapshots
              description: "Creates a snapshot of a device."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
                - name: device_id
                  in: path
                  type: string
                  required: true
                  description: "Device identifier."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-snapshot
              method: DELETE
              path: /api/v1/organisations/{organisation_id}/projects/{project_id}/devices/{device_id}/snapshots/{snapshot_id}
              description: "Deletes a snapshot."
              inputParameters:
                - name: organisation_id
                  in: path
                  type: string
                  required: true
                  description: "Organisation identifier."
                - name: project_id
                  in: path
                  type: string
                  required: true
                  description: "Project identifier."
                - name: device_id
                  in: path
                  type: string
                  required: true
                  description: "Device identifier."
                - name: snapshot_id
                  in: path
                  type: string
                  required: true
                  description: "Snapshot identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
